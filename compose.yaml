services:
  car-lab:
    build: .
    ports:
      - "127.0.0.1:8765:8000"
    volumes:
      - ./data:/app/data
    environment:
      CAR_DATA_DIR: /app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
